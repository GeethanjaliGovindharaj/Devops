<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache Docker Project</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
            background: rgba(0,0,0,0.2);
        }

        h1 {
            margin: 0;
        }

        .container {
            padding: 50px 20px;
        }

        .card {
            background: white;
            color: #333;
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #5a67d8;
        }

        footer {
            margin-top: 40px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<header>
    <h1>Apache Docker Project 🚀</h1>
</header>

<div class="container">
    <p>This website is running inside a Docker container using Apache.</p>

    <div class="card">
        <h2>About</h2>
        <p>This is a mini project demonstrating containerized web hosting.</p>
    </div>

    <div class="card">
        <h2>Status</h2>
        <p>Server is running successfully 🎉</p>
    </div>

    <button onclick="showMessage()">Click Me</button>
</div>

<footer>
    <p>Built using Docker + Apache</p>
</footer>

<script>
    function showMessage() {
        alert("Docker + Apache is working perfectly!");
    }
</script>

</body>
</html>
